name: UUID operation benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - "uuidv7/**"
      - "fastuuid7/**"
      - "benchmarks/uuid_operations.py"
      - ".github/workflows/uuid-operations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: UUID operations / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
      - name: Build installed candidate and reference environments
        run: |
          uv build --python "${{ matrix.python }}" --wheel
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/uuid-current"
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/uuid-legacy"
          uv pip install --python "$RUNNER_TEMP/uuid-current/bin/python" dist/*.whl "uuid-utils==1.2.0" "fastuuidv7==0.1.10" "fastuuid==0.14.0"
          uv pip install --python "$RUNNER_TEMP/uuid-legacy/bin/python" dist/*.whl "uuid-utils==0.19.0" "fastuuidv7==0.1.10" "fastuuid==0.14.0"
      - name: Measure sequentially outside checkout
        working-directory: ${{ runner.temp }}
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          "$RUNNER_TEMP/uuid-current/bin/python" "$GITHUB_WORKSPACE/benchmarks/uuid_operations.py" --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/current.json"
          "$RUNNER_TEMP/uuid-legacy/bin/python" "$GITHUB_WORKSPACE/benchmarks/uuid_operations.py" --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/legacy.json"
      - uses: actions/upload-artifact@v4
        with:
          name: uuid-operations-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/current.json
            ${{ runner.temp }}/legacy.json
          retention-days: 30
