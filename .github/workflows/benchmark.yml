name: Benchmark

on:
  push:
    branches: [main, master]
    paths:
      - "uuidv7/**"
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "uuidv7/**"
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Run benchmarks
        run: |
          source .venv/bin/activate
          python benchmarks/benchmark.py --output benchmark-results.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.md
          retention-days: 14

      - name: Comment benchmark results
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const results = fs.readFileSync("benchmark-results.md", "utf8");
            const output = `## Benchmark Results\n\n${results}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  clock-sources:
    name: Clock Sources on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run clock source benchmark
        run: python benchmarks/clock_sources.py --output clock-source-results.md

      - name: Upload clock source results
        uses: actions/upload-artifact@v4
        with:
          name: clock-source-results-${{ matrix.os }}
          path: clock-source-results.md
          retention-days: 14
