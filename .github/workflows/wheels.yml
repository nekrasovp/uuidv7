name: Wheels

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw-archs-linux: x86_64
            cibw-archs-macos: auto
            cibw-archs-windows: auto
          - os: ubuntu-24.04-arm
            cibw-archs-linux: aarch64
            cibw-archs-macos: auto
            cibw-archs-windows: auto
          - os: macos-15-intel
            cibw-archs-linux: auto
            cibw-archs-macos: x86_64
            cibw-archs-windows: auto
          - os: macos-15
            cibw-archs-linux: auto
            cibw-archs-macos: arm64
            cibw-archs-windows: auto
          - os: windows-latest
            cibw-archs-linux: auto
            cibw-archs-macos: auto
            cibw-archs-windows: AMD64 x86
          - os: windows-11-arm
            cibw-archs-linux: auto
            cibw-archs-macos: auto
            cibw-archs-windows: ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_LINUX: ${{ matrix.cibw-archs-linux }}
          CIBW_ARCHS_MACOS: ${{ matrix.cibw-archs-macos }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.cibw-archs-windows }}
          CIBW_TEST_COMMAND: >-
            python -c "import uuid, fastuuid7, uuidv7; values = fastuuid7.uuid7_many(10); assert fastuuid7.uuid7 is uuidv7.uuid7; assert all(isinstance(u, uuid.UUID) and u.version == 7 for u in values)"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 7

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7
