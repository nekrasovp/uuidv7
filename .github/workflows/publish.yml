name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.1.0)"
        required: true
        type: string

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify source versions match the requested release
        env:
          EXPECTED_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        run: python tools/check_release_version.py "$EXPECTED_VERSION"

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build package
        run: |
          uv build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw-archs-linux: x86_64
            cibw-archs-macos: auto
            cibw-archs-windows: auto
          - os: ubuntu-24.04-arm
            cibw-archs-linux: aarch64
            cibw-archs-macos: auto
            cibw-archs-windows: auto
          - os: macos-15-intel
            cibw-archs-linux: auto
            cibw-archs-macos: x86_64
            cibw-archs-windows: auto
          - os: macos-15
            cibw-archs-linux: auto
            cibw-archs-macos: arm64
            cibw-archs-windows: auto
          - os: windows-latest
            cibw-archs-linux: auto
            cibw-archs-macos: auto
            cibw-archs-windows: AMD64 x86
          - os: windows-11-arm
            cibw-archs-linux: auto
            cibw-archs-macos: auto
            cibw-archs-windows: ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_LINUX: ${{ matrix.cibw-archs-linux }}
          CIBW_ARCHS_MACOS: ${{ matrix.cibw-archs-macos }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.cibw-archs-windows }}
          CIBW_TEST_COMMAND: >-
            python -c "import uuid, fastuuid7, uuidv7; values = fastuuid7.uuid7_many(10); assert fastuuid7.uuid7 is uuidv7.uuid7; assert all(isinstance(u, uuid.UUID) and u.version == 7 for u in values)"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 7

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [sdist, wheels]
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Validate distribution metadata
        run: |
          python -m pip install --disable-pip-version-check "twine>=6.0.0"
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
