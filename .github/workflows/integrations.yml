name: UUID integrations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  properties:
    name: UUID properties / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.28"
      - run: uv sync --python "${{ matrix.python }}" --extra dev --extra properties --locked
      - name: Check UUID properties (Hypothesis is required)
        run: uv run --extra dev --extra properties --locked pytest tests/test_uuid_compat_properties.py

  frameworks:
    name: PostgreSQL and frameworks / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    services:
      postgres:
        image: postgres:17@sha256:ebba4f4de37f08f138f97c1443c987a435e783177afedcc4aaf2da1930fbc37a
        env:
          POSTGRES_DB: fastuuid7_test
          POSTGRES_USER: fastuuid7_test
          POSTGRES_PASSWORD: fastuuid7_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fastuuid7_test -d fastuuid7_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FASTUUID7_RUN_INTEGRATIONS: "1"
      FASTUUID7_TEST_POSTGRES_DSN: postgresql://fastuuid7_test:fastuuid7_test@127.0.0.1:5432/fastuuid7_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.28"
      - run: uv sync --python "${{ matrix.python }}" --extra dev --extra integrations --locked
      - name: Check frameworks and real PostgreSQL (no optional dependency skips)
        run: uv run --extra dev --extra integrations --locked pytest tests/integration
