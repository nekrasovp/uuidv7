name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  parser-sanitizers:
    name: UUID parser sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz production parser with ASan and UBSan
        run: |
          mkdir -p /tmp/uuid-corpus
          python -c 'from pathlib import Path; Path("/tmp/uuid-corpus/urn").write_text("URN:UUID:00112233-4455-6677-8899-aabbccddeeff")'
          clang -O1 -g -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -Iuuidv7/uuidv7_impl/include tools/fuzz_uuid_parse.c -o /tmp/uuid-fuzz
          /tmp/uuid-fuzz -runs=200000 -seed=9562 /tmp/uuid-corpus

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python with uv
        run: uv python install "${{ matrix.python-version }}"

      - name: Install dependencies
        run: |
          uv sync --python "${{ matrix.python-version }}" --extra dev --locked

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v

  lint:
    name: Lint and format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --python 3.14 --extra dev --locked

      - name: Run linting
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .
          mypy

  build:
    name: Build package
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build package
        run: |
          uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7
